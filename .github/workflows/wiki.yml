# Mirrors docs/ to the GitHub wiki on every push to main.
# docs/ is the source of truth: edits made in the wiki web editor are overwritten.
# One-time setup: enable Wikis in repo settings and create any first page in the browser.
name: Sync docs to wiki

on:
  push:
    branches: [master]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Wiki repo not found. Enable Wikis and create the first page in the browser, then re-run."
            exit 1
          fi

      - name: Copy docs and fix links
        run: |
          rm -f wiki/*.md
          cp docs/*.md wiki/
          [ -f wiki/README.md ] && mv wiki/README.md wiki/Home.md

          # Wiki page URLs have no extension: (core.md#x) -> (core#x), (README.md) -> (Home)
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' wiki/*.md
          sed -i -E 's/\]\(README(#[^)]*)?\)/](Home\1)/g' wiki/*.md

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
